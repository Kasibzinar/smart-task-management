<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      const path = window.location.pathname;
      const repo = '/smart-task-management';

      if (path.startsWith(repo)) {
        const route = path.slice(repo.length);

        const redirectUrl = repo + '/?redirect=' + encodeURIComponent(route);

        window.location.replace(redirectUrl);
      }
    </script>
  </head>
  <body></body>
</html>
